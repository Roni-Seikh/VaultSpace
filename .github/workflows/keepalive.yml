# Free Supabase projects pause after about a week of inactivity. This pings the health endpoint
# (which performs one tiny DB query) twice a week. Set the repo variable APP_URL, e.g. https://your-app.vercel.app
name: Keep database awake
on:
  schedule: [{ cron: "17 6 * * 1,4" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        env: { APP_URL: "${{ vars.APP_URL }}" }
        run: |
          test -n "$APP_URL" || { echo "Set the APP_URL repository variable"; exit 1; }
          curl --fail --silent --show-error "$APP_URL/api/health"
